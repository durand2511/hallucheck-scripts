name: Build serverless image

on:
  push:
    branches: [main]
    paths: [serverless/**]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The default ubuntu-latest runner only has ~14GB free -- torch/torchvision/torchaudio
      # cu124 wheels plus the CUDA devel base image blow well past that ("No space left on
      # device", confirmed live on the first build attempt). Clearing preinstalled software this
      # runner ships with by default (Android SDK, .NET, GHC, etc, none of which this build
      # needs) frees up ~25-30GB before the build even starts.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      # Adapter weights (~200MB) live as GitHub Release assets, not in git history -- one file
      # (adapter_model.safetensors) is well over GitHub's 100MB regular-push limit. Downloaded
      # here into serverless/adapter/ so the Dockerfile's `COPY adapter/ /app/adapter/` finds them.
      - name: Download adapter release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p serverless/adapter
          gh release download adapter-v2 --repo durand2511/hallucheck-scripts --dir serverless/adapter --clobber

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA, not just :latest -- confirmed live: a worker kept running an
      # old broken build even after a fixed image was pushed to :latest, because it had already
      # cached that mutable tag locally and never re-pulled. A SHA tag is a genuinely new
      # reference every build, so there's no stale-cache ambiguity about which image is running.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: serverless/Dockerfile
          push: true
          tags: |
            ghcr.io/durand2511/hallucheck-serverless:latest
            ghcr.io/durand2511/hallucheck-serverless:${{ github.sha }}

      - name: Print the SHA-tagged image reference
        run: echo "IMAGE=ghcr.io/durand2511/hallucheck-serverless:${{ github.sha }}"
